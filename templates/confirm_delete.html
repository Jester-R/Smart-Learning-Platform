{% extends "base.html" %}
{% block page_title %}Confirm deletion{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6">
<div class="card border-danger shadow-sm"><div class="card-body">
    <h1 class="h4 text-danger">Delete {{ object }}</h1>
    <p>{% translate "This action cannot be undone." %}</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">{% translate "Yes, delete" %}</button>
        <a class="btn btn-outline-secondary" href="{% if cancel_url %}{{ cancel_url }}{% else %}{% url 'dashboard' %}{% endif %}">{% translate "Cancel" %}</a>
    </form>
</div></div>
</div></div>
{% endblock %}
