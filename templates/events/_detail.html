<div class="card"><div class="card-body"><h1 class="h5">{{ event.title }}</h1><p class="small text-secondary">{{ event.starts_at }} &ndash; {{ event.ends_at }}{% if event.location %} &middot; {{ event.location }}{% endif %}</p><p>{{ event.description }}</p>
{% if registered %}<span class="badge text-bg-success">Registered</span>{% elif can_register %}<a class="btn btn-primary" href="{% url 'events:register' pk=event.pk %}">Register</a>{% else %}<span class="text-secondary">Registration unavailable</span>{% endif %}
</div></div>
