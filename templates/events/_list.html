<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h1 class="h4 mb-0">Events and workshops</h1><a class="btn btn-outline-primary" href="{% url 'events:my_registrations' %}">My registrations</a></div>
<div class="row g-3">{% for event in events %}<div class="col-lg-6"><div class="card h-100"><div class="card-body"><h2 class="h6">{{ event.title }}</h2><div class="small text-secondary mb-2">{{ event.starts_at }}{% if event.location %} &middot; {{ event.location }}{% endif %}</div><p class="small">{{ event.description|truncatechars:160 }}</p><a class="btn btn-sm btn-primary" href="{% url 'events:detail' pk=event.pk %}">View details</a></div></div></div>{% empty %}<div class="col-12"><div class="alert alert-light">No upcoming events.</div></div>{% endfor %}</div>
