{% extends "base.html" %}
{% block page_title %}Register for event{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-7"><div class="card"><div class="card-body"><h1 class="h5">{% translate "Confirm registration" %}</h1><p>{{ event.title }}</p><form method="post">{% csrf_token %}<button class="btn btn-primary" type="submit">{% translate "Confirm" %}</button><a class="btn btn-outline-secondary" href="{% url 'events:detail' pk=event.pk %}">Cancel</a></form></div></div></div></div>
{% endblock %}
