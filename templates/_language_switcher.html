{% get_current_language as CURRENT_LANGUAGE %}
{% get_available_languages as AVAILABLE_LANGUAGES %}
<form class="language-switcher" method="post" action="{% url 'set_language' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label class="visually-hidden" for="languageSelect">{% translate "Language" %}</label>
    <select id="languageSelect" name="language" class="form-select form-select-sm" onchange="this.form.submit()">
        {% for code, name in AVAILABLE_LANGUAGES %}
        <option value="{{ code }}"{% if code == CURRENT_LANGUAGE %} selected{% endif %}>{{ name }}</option>
        {% endfor %}
    </select>
</form>
