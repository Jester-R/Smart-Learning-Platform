<div class="d-flex flex-wrap justify-content-between gap-2 mb-3"><h1 class="h4 mb-0">Help center</h1><div class="d-flex gap-2"><a class="btn btn-outline-primary" href="{% url 'support:ticket_create' %}">Contact support</a><a class="btn btn-outline-secondary" href="{% url 'support:ticket_list' %}">My tickets</a><a class="btn btn-outline-secondary" href="{% url 'support:feedback_create' %}">Send feedback</a></div></div>
<div class="accordion" id="faqAccordion">{% for faq in faqs %}<div class="accordion-item"><h2 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#faq-{{ faq.pk }}">{{ faq.question }}</button></h2><div id="faq-{{ faq.pk }}" class="accordion-collapse collapse" data-bs-parent="#faqAccordion"><div class="accordion-body">{{ faq.answer }}</div></div></div>{% empty %}<div class="alert alert-light">No FAQs published yet.</div>{% endfor %}</div>
